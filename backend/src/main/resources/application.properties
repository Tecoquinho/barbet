spring.application.name=barbet-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/barbet}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${APP_JWT_SECRET:barbet-super-secret-key-for-mvp-only-change-me}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:720}
app.admin-email=${APP_ADMIN_EMAIL:admin@barbet.com}
app.admin-password=${APP_ADMIN_PASSWORD:123456}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
